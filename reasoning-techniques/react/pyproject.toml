[project]
name = "react"
version = "0.1.0"
description = "Reasoning and Acting (ReAct) Reasoning Technique Pattern using Google Agent Development Kit (ADK)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.13.0",
    "google-genai>=2.10.0",
    "nest-asyncio>=1.6.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

