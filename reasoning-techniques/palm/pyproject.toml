[project]
name = "palm"
version = "0.1.0"
description = "Program-Aided Language Models (PALM / PAL) Reasoning Technique Pattern using Google Agent Development Kit (ADK)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.13.0",
    "google-genai>=2.10.0",
    "nest-asyncio>=1.6.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

